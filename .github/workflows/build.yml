
name: Build Tarbiyat Nafs APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TarbiyatNafs-Android-Project-ICON.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o TarbiyatNafs-Android-Project-ICON.zip -d /tmp/project
          cp -r /tmp/project/TarbiyatNafsAndroid/. .

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarbiyatNafs-APK
          path: app/build/outputs/apk/debug/app-debug.apk
